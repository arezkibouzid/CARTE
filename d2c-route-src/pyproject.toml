[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d2c-route"
version = "0.1.0"
description = "D2C-Route: doctrine-to-constraint routing for military logistic convoy networks (AMIAD hackathon)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0",
    "requests>=2.28",
]

[project.optional-dependencies]
osm = ["osmnx>=1.9", "geopandas>=0.14", "shapely>=2.0"]
viz = ["folium>=0.15"]
dev = ["pytest>=7"]

[project.scripts]
d2c-route = "d2c_route.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
d2c_route = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
