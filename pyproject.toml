[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coa-net"
version = "0.1.0"
description = "COA-Net: network-first, threat-aware design of logistic convoy road networks with courses of action (AMIAD hackathon)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0",
    "requests>=2.28",
    "ortools>=9.8",
]

[project.optional-dependencies]
osm = ["osmnx>=1.9", "geopandas>=0.14", "shapely>=2.0"]
dev = ["pytest>=7"]

[project.scripts]
coa-net = "coa_net.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coa_net = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
