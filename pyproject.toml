[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coa-net"
version = "0.1.0"
description = "COA-Net: network-first, threat-aware design of logistic convoy road networks with courses of action (AMIAD hackathon)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.0",
    "pydantic>=2.0",
    "requests>=2.28",
    "ortools>=9.8",
]

[project.optional-dependencies]
osm = ["osmnx>=1.9", "geopandas>=0.14", "shapely>=2.0"]
# organisers' Scenario data (shapefiles, scanned maps, exercise sketch)
real = ["geopandas>=0.14", "pyogrio>=0.7", "shapely>=2.0", "pyproj>=3.6", "rasterio>=1.3", "scipy>=1.11", "pandas>=2.0",
        "matplotlib>=3.7", "pillow>=10", "rapidocr_onnxruntime>=1.2", "pypdf>=4"]
# documents: doctrine sets and orders as PDF, Word, text or images (OCR), sketch reader
docs = ["pdfplumber>=0.11", "python-docx>=1.1", "pypdfium2>=4", "pypdf>=4", "pillow>=10", "rapidocr_onnxruntime>=1.2",
        "scipy>=1.11"]
# image input: road network read from the scans, and its learned corrector (coa-net scan-roads, scan-learn)
scan = ["opencv-python-headless>=4.8", "scikit-image>=0.21", "lightgbm>=4.0", "scikit-learn>=1.3"]
dev = ["pytest>=7"]

[project.scripts]
coa-net = "coa_net.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coa_net = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
